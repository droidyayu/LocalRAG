name: iosApp
options:
  bundleIdPrefix: com.ayushig.localrag
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
# The LiteRT-LM Swift package is fetched by scripts/ios_fetch_litertlm.sh (sparse clone plus a
# checksum-verified binary download at the version pinned in gradle/libs.versions.toml). On a fast
# network the upstream remote package works too: url https://github.com/google-ai-edge/LiteRT-LM.
packages:
  LiteRTLM:
    path: Vendor/LiteRTLM
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The docs bundle built by the LocalRAG Gradle plugin (same bytes as on Android), bundled as
      # the folder "localrag/" so the SDK finds "localrag/docs.localrag" in the app bundle.
      - path: ../androidApp/build/localrag/assets/localrag
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushig.localrag.demo
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Apple silicon simulators only (decision D1): the Kotlin framework has no x86_64 slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build the Kotlin framework
        script: |
          cd "$SRCROOT/.."
          export PATH="/opt/homebrew/bin:$PATH"
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home}"
          GRADLE="$(command -v gradle || echo ./gradlew)"
          "$GRADLE" :androidApp:generateLocalRagBundle :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
