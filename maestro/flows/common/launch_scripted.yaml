# Shared subflow: launch the app with the scripted engine selected.
#
# Maestro does not interpolate env variables inside launch arguments, so each mode has its own file.

appId: com.ayushig.localrag.demo
---
- launchApp:
    appId: com.ayushig.localrag.demo
    stopApp: true
    clearState: true
    arguments:
      localrag.engine: scripted
# A cold start with cleared state can take a while on a slow emulator: wait for the tab bar
# instead of letting the next tap race the first frame.
- extendedWaitUntil:
    visible: "Retrieval"
    timeout: 60000
