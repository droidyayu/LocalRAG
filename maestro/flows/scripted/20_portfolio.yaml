# Scripted lane: portfolio questions are grounded by the account tools.
#
# "from your account" proves a portfolio tool grounded the turn. The nameless
# lookup must meet the fixed fallback word for word (copied from the
# real-model 01_portfolio flow). Figures are not asserted here.

appId: com.ayushig.localrag.demo
---
- runFlow:
    file: ../common/launch_scripted.yaml
- runFlow:
    file: ../common/open_assistant.yaml

- runFlow:
    file: ../common/ask.yaml
    env:
      QUESTION: "What is my portfolio worth?"
- extendedWaitUntil:
    visible: "from your account"
    timeout: 60000
- runFlow:
    file: ../common/clear_chat.yaml

- runFlow:
    file: ../common/ask.yaml
    env:
      QUESTION: "How are my metals doing?"
- extendedWaitUntil:
    visible: "from your account"
    timeout: 60000
- runFlow:
    file: ../common/clear_chat.yaml

- runFlow:
    file: ../common/ask.yaml
    env:
      QUESTION: "What is my margin status?"
- extendedWaitUntil:
    visible: "from your account"
    timeout: 60000
- runFlow:
    file: ../common/clear_chat.yaml

- runFlow:
    file: ../common/ask.yaml
    env:
      QUESTION: "Do I hold any gold?"
- extendedWaitUntil:
    visible: "from your account"
    timeout: 60000
- runFlow:
    file: ../common/clear_chat.yaml

# Lookup with no name must not guess: fixed fallback, word for word.
- runFlow:
    file: ../common/ask.yaml
    env:
      QUESTION: "Find my holding"
- extendedWaitUntil:
    visible: >-
      I don't have information on that yet. I can answer questions about your portfolio
      and the help documentation — try rephrasing, or check the Retrieval tab to see
      what the docs cover.
    timeout: 60000
