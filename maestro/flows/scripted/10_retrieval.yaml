# Scripted lane: one retrieval search per query, top-1 chunk id asserted.
#
# `visible:` is a regex, hence the `.*<id>.*` wrappers. Between searches the
# app is relaunched to clear the query field: the field keeps its text across tab
# switches and select-all is not available on both platforms.

appId: com.ayushig.localrag.demo
---
- runFlow:
    file: ../common/launch_scripted.yaml
- tapOn: "Retrieval"

# how do I deposit funds -> deposit-funds
- tapOn: "Ask the docs"
- inputText: "how do I deposit funds"
- hideKeyboard
- tapOn: "Search"
- extendedWaitUntil:
    visible: ".*deposit-funds.*"
    timeout: 60000
- runFlow:
    file: ../common/launch_scripted.yaml
- tapOn: "Retrieval"

# brokerage charges -> brokerage-charges
