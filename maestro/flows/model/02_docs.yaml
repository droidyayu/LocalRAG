# Assistant acceptance suite: documentation answers come from the help corpus.
#
# "from the help documentation" proves the search tool grounded the turn.
# Anything the corpus does not cover must meet the fixed fallback verbatim.

appId: com.ayushig.localrag.demo
---
- launchApp:
    appId: com.ayushig.localrag.demo
# Cold start lands on the Portfolio tab; the assistant lives under Assistant.
- tapOn: "Assistant"
- extendedWaitUntil:
    visible: ${READY_LABEL}
    timeout: 300000
- tapOn: "More"
- tapOn: "Clear chat"

# Covered by deposit-funds.md.
- tapOn: "Ask something"
- inputText: 'How do I deposit funds?'
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "from the help documentation"
    timeout: 180000
- tapOn: "More"
- tapOn: "Clear chat"

# Covered by brokerage-charges.md.
- tapOn: "Ask something"
- inputText: 'What are the brokerage charges?'
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "from the help documentation"
    timeout: 180000
- tapOn: "More"
- tapOn: "Clear chat"

# Covered by close-account.md.
- tapOn: "Ask something"
- inputText: 'How do I close my account?'
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "from the help documentation"
    timeout: 180000
- tapOn: "More"
- tapOn: "Clear chat"

# No doc covers passwords: the app's fixed fallback or the model's own plain "do not have
# information" answer are both honest; what must never appear is invented steps, so the check is
# that an information-lacking reply shows (regex: visible: matches the whole text).
- tapOn: "Ask something"
- inputText: 'How do I reset my password?'
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*(do not have|don't have) information.*"
    timeout: 180000
