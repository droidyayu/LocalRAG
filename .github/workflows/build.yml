name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The whole build-time and runtime parity guarantee rests on localrag-core being shared by
      # the Gradle plugin and the Android runtime. A single Android or LiteRT dependency would
      # break that sharing, and nothing else in the build would notice.
      - name: localrag-core stays pure Kotlin
        run: ./gradlew -p localrag-tooling :localrag-core:verifyNoPlatformDependencies

      - name: Unit tests
        run: |
          ./gradlew -p localrag-tooling :localrag-core:jvmTest
          ./gradlew :localrag:allTests :androidApp:testDebugUnitTest

      - name: Assemble
        run: ./gradlew :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The iOS app itself is not built here: it needs the vendored LiteRT-LM xcframeworks from
      # scripts/ios_fetch_litertlm.sh, and it is covered locally by scripts/verify.sh.
      - name: Core iOS simulator tests
        run: ./gradlew -p localrag-tooling :localrag-core:iosSimulatorArm64Test

      - name: SDK and shared tests
        run: |
          ./gradlew :localrag:allTests
          ./gradlew :shared:allTests

      - name: Link shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
